name: self-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # Both checks are dependency-free and offline. The DSH runtime check
      # reports a skip here, because no DSH installation exists on the runner.
      - name: Verify the language pack
        run: npm test
      - name: Verify the dictionary rebuilds from its parts
        run: |
          npm run assemble
          git diff --exit-code -- ru/ru.json
